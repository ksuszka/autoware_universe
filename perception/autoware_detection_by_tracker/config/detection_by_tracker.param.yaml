/**:
  ros__parameters:
    tracker_ignore_label.UNKNOWN : true
    tracker_ignore_label.CAR : false
    tracker_ignore_label.TRUCK : false
    tracker_ignore_label.BUS : false
    tracker_ignore_label.TRAILER : false
    tracker_ignore_label.MOTORCYCLE : false
    tracker_ignore_label.BICYCLE : false
    tracker_ignore_label.PEDESTRIAN : false

    # Object splitter parameters
    use_object_splitter: true # If true, use object splitter instead of object tracker
    extend_scale: 1.05 # Scale factor for extending the polygon of the large objects
    buffer_distance: 0.1 # Buffer distance for the polygon of the small objects
    existence_probability_threshold: 0.08 # Threshold for existence probability to update the tracked object
    existence_probability_modifier: 0.5 # Modifier for existence probability to update the tracked object
    fast_spawn_unknown_clusters: false  # If true, new UNKNOWN clusters get existence_probability=1.0 and
                                        # can be tracked immediately. If false, existence_probability=0.0 and
                                        # the isLargerThanChild size gate applies, matching plain clustering detections.